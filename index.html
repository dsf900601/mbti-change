<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MBTI 변환게임</title>
<style>
  :root {
    --bg: #f4f2fb;
    --card-bg: #ffffff;
    --text: #26223a;
    --text-sub: #6c6684;
    --accent: #6c5ce7;
    --accent-dark: #5343c9;
    --line: #e4e0f5;
    --danger: #e0245e;
    --ok: #21b573;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
    overflow-x: hidden;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h1, h2, h3 { margin: 0; line-height: 1.35; }
  h1 { font-size: 1.35rem; }
  h2 { font-size: 1.15rem; }
  p { margin: 0; }
  .muted { color: var(--text-sub); font-size: 0.85rem; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 2px 10px rgba(70, 60, 130, 0.06);
  }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit;
    cursor: pointer;
  }
  .btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    min-height: 48px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: #fbfaff;
    color: var(--text);
    font-size: 0.98rem;
    transition: background 0.12s, border-color 0.12s, transform 0.06s;
  }
  .btn:active { transform: scale(0.99); }
  .btn:hover { background: #f1eefe; }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    text-align: center;
    font-weight: 600;
  }
  .btn.primary:hover { background: var(--accent-dark); }
  .btn.locked {
    opacity: 0.45;
    cursor: not-allowed;
    background: #f2f1f7;
  }
  .btn.toggle {
    text-align: center;
    font-weight: 600;
  }
  .btn.toggle.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cat-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .cat-btn .count {
    font-size: 0.78rem;
    color: var(--text-sub);
    flex-shrink: 0;
  }
  .progress-bar {
    height: 6px;
    background: var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar > div {
    height: 100%;
    background: var(--accent);
  }
  .prompt-text {
    white-space: pre-wrap;
    font-size: 1rem;
  }
  .axis-track {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 6px 0;
  }
  .axis-end {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.95rem;
    border: 2px solid var(--line);
    color: var(--text-sub);
    flex-shrink: 0;
  }
  .axis-end.hit {
    border-color: var(--accent);
    color: #fff;
    background: var(--accent);
  }
  .axis-line {
    flex: 1;
    height: 2px;
    background: var(--line);
    position: relative;
  }
  .axis-line .arrow {
    position: absolute;
    top: -8px;
    font-size: 0.75rem;
    color: var(--accent);
    white-space: nowrap;
    left: 50%;
    transform: translateX(-50%);
  }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    background: #efeafd;
    color: var(--accent-dark);
    font-size: 0.8rem;
    font-weight: 600;
  }
  .center { text-align: center; }
  .title-huge {
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .arrow-big { color: var(--text-sub); font-size: 1.1rem; margin: 0 6px; }
  .footer-nav { display: flex; gap: 8px; }
  .footer-nav .btn { flex: 1; }
  .profile-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .small { font-size: 0.82rem; }
  @media (min-width: 560px) {
    #app { padding-top: 32px; }
    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>

 *    임의로 수정하지 않았다.

  { key: 'people',   name: '사람' },

    choices: [
      { text: '"그래, 같이 보자." 하고 변경된 약속대로 만난다.', letter: 'P', magnitude: 2, tag: 'change_accept', wildcard: false },
      { text: '누구인지부터 물어본다. 어떤 사람인지 알고 나서 대답하고 싶다.', letter: null, magnitude: 0, tag: 'info_first', wildcard: false },
      { text: '"난 너랑 둘이 보는 줄 알았는데?"라고 말한다. 갑자기 계획이 달라진 게 조금 걸린다.', letter: 'J', magnitude: 1, tag: 'expectation_voice', wildcard: false },

      { text: '"그럼 다음에 셋이 보자. 오늘은 우리끼리 먹자."', letter: 'J', magnitude: 2, tag: 'original_plan', wildcard: false }

  {

      { text: '"말수가 적었고, 주로 듣고 있던데."', letter: 'S', magnitude: 2, tag: 'observed_fact', wildcard: false },

  {
    id: 'people-3', categoryKey: 'people', title: '친구가 사고를 쳤다', axis: 'TF',

  {

var ALL_LETTERS = ['I', 'E', 'S', 'N', 'T', 'F', 'J', 'P'];

// GAME_SPEC.md 21장: "대표 특수 칭호"의 희귀도 우선순위는 아직 확정되지 않았다고 명시되어 있다.
// v1에서는 실제 플레이 데이터가 없으므로, 23장에 나열된 순서를 그대로 우선순위로 사용하는
// 임시 규칙을 둔다. 이는 명세가 확정하지 않은 부분에 대한 잠정 구현이며, 보고서에 별도로 표기한다.
var SPECIAL_TITLE_DISPLAY_ORDER = [
  'boundary_one', 'boundary_many', 'wildcard_master', 'one_track',

/* =========================================================================
 * 2. 순수 로직 (DOM에 의존하지 않아 그대로 테스트할 수 있다)
 * ========================================================================= */

function shuffle(arr, rng) {
  rng = rng || Math.random;
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function splitTags(tagStr) {
  return tagStr.split('/').map(function (s) { return s.trim(); }).filter(Boolean);
}

function matchedProfileIds(choice) {
  var subtags = splitTags(choice.tag);
  var matched = [];
  BEHAVIOR_PROFILES.forEach(function (profile) {
    var hit = subtags.some(function (t) { return profile.tags.indexOf(t) !== -1; });
    if (hit) matched.push(profile.id);
  });
  return matched;
}

function createInitialState(startMbti) {
  var axisScores = {};
  AXES.forEach(function (ax) {
    axisScores[ax.key] = {};
    axisScores[ax.key][ax.letters[0]] = 0;
    axisScores[ax.key][ax.letters[1]] = 0;
  });
  var categoryPlayCount = {};
  CATEGORIES.forEach(function (c) { categoryPlayCount[c.key] = 0; });
  var profileOpportunity = {};
  var profileActual = {};
  BEHAVIOR_PROFILES.forEach(function (p) { profileOpportunity[p.id] = 0; profileActual[p.id] = 0; });
  var plus2Opportunity = {};
  var plus2Selected = {};
  ALL_LETTERS.forEach(function (l) { plus2Opportunity[l] = 0; plus2Selected[l] = 0; });

  return {
    startMbti: startMbti,
    turn: 0,               // 완료된 턴 수 (0~20)
    completed: false,
    playedEventIds: [],
    categoryPlayCount: categoryPlayCount,
    axisScores: axisScores,
    wildcardOpportunities: 0,
    wildcardSelected: 0,
    profileOpportunity: profileOpportunity, // 기대 선택량 (실수 누적)
    profileActual: profileActual,
    plus2Opportunity: plus2Opportunity,
    plus2Selected: plus2Selected,
    history: [] // 각 턴의 상세 기록
  };
}

function eventsForCategory(catKey) {
  return EVENTS.filter(function (e) { return e.categoryKey === catKey; });
}

function unplayedEventsForCategory(state, catKey) {
  return eventsForCategory(catKey).filter(function (e) { return state.playedEventIds.indexOf(e.id) === -1; });
}

function isCategoryLocked(state, catKey) {
  return state.categoryPlayCount[catKey] >= 5;
}

function pickRandomEvent(state, catKey, rng) {
  rng = rng || Math.random;
  var pool = unplayedEventsForCategory(state, catKey);
  if (pool.length === 0) return null;
  var idx = Math.floor(rng() * pool.length);
  return pool[idx];
}

// displayedOrder: 셔플된 선택지의 원본 index 배열 (예: [2,0,1])
// originalChoiceIndex: 플레이어가 실제로 선택한 선택지의 "원본" 배열 내 index
function recordChoice(state, event, originalChoiceIndex, displayedOrder) {
  var choice = event.choices[originalChoiceIndex];
  var totalChoices = event.choices.length;

  // 1) 축 점수 누적 (0점은 영향 없음)
  if (choice.letter) {
    state.axisScores[event.axis][choice.letter] += choice.magnitude;
  }

  // 2) wildcard 기회/선택 (이벤트 단위로 1회만 카운트)
  var eventHasWildcard = event.choices.some(function (c) { return c.wildcard; });
  if (eventHasWildcard) {
    state.wildcardOpportunities += 1;
    if (choice.wildcard) state.wildcardSelected += 1;
  }

  // 3) 행동 프로필 기대 선택량 / 실제 선택 횟수
  BEHAVIOR_PROFILES.forEach(function (profile) {
    var matchCount = event.choices.filter(function (c) { return matchedProfileIds(c).indexOf(profile.id) !== -1; }).length;
    state.profileOpportunity[profile.id] += matchCount / totalChoices;
  });
  var matched = matchedProfileIds(choice);
  matched.forEach(function (pid) { state.profileActual[pid] += 1; });

  // 4) ±2 방향별 기회/선택 (이벤트 단위: 그 이벤트에 해당 letter+2 선택지가 존재하면 기회 1)
  ALL_LETTERS.forEach(function (letter) {
    var hasPlus2 = event.choices.some(function (c) { return c.letter === letter && c.magnitude === 2; });
    if (hasPlus2) {
      state.plus2Opportunity[letter] += 1;
      if (choice.letter === letter && choice.magnitude === 2) {
        state.plus2Selected[letter] += 1;
      }
    }
  });

  // 5) 진행 상태 갱신
  state.playedEventIds.push(event.id);
  state.categoryPlayCount[event.categoryKey] += 1;
  state.turn += 1;

  // 6) 히스토리 저장 (24장 "한 플레이에서 저장해야 하는 데이터" 반영)
  state.history.push({
    order: state.turn,
    eventId: event.id,
    category: event.categoryKey,
    displayedOrder: displayedOrder.slice(),
    chosenOriginalIndex: originalChoiceIndex,
    letter: choice.letter,
    magnitude: choice.magnitude,
    tag: choice.tag,
    wildcard: choice.wildcard,
    matchedProfiles: matched
  });

  if (state.turn >= 20) state.completed = true;
  return state;
}

function computeFinalMbti(state) {
  var result = {};
  AXES.forEach(function (ax) {
    var a = ax.letters[0], b = ax.letters[1];
    var scoreA = state.axisScores[ax.key][a];
    var scoreB = state.axisScores[ax.key][b];
    var net = scoreA - scoreB;
    var startLetter = state.startMbti.split('').filter(function (ch) { return ax.letters.indexOf(ch) !== -1; })[0];
    var finalLetter;
    if (net > 0) finalLetter = a;
    else if (net < 0) finalLetter = b;
    else finalLetter = startLetter;
    result[ax.key] = {
      startLetter: startLetter,
      finalLetter: finalLetter,
      net: net,
      changed: finalLetter !== startLetter,
      isZero: net === 0
    };
  });
  var finalMbti = AXES.map(function (ax) { return result[ax.key].finalLetter; }).join('');
  return { axes: result, finalMbti: finalMbti };
}

function computeBaseTitle(changeCount) {
  return BASE_TITLES[changeCount];
}

function computeBehaviorProfiles(state) {
  var list = BEHAVIOR_PROFILES.map(function (profile) {
    var expected = state.profileOpportunity[profile.id];
    var actual = state.profileActual[profile.id];
    var strength = expected > 0 ? actual / expected : 0;
    var qualified = actual >= 2 && strength >= 1.8;
    return { id: profile.id, name: profile.name, desc: profile.desc, expected: expected, actual: actual, strength: strength, qualified: qualified };
  });
  var qualifiedList = list.filter(function (p) { return p.qualified; });
  qualifiedList.sort(function (a, b) { return b.strength - a.strength; });
  return { all: list, top: qualifiedList.slice(0, 2) };
}

function computeSpecialTitles(state, mbtiResult) {
  var earned = [];

  var zeroAxes = AXES.filter(function (ax) { return mbtiResult.axes[ax.key].isZero; });
  if (zeroAxes.length === 1) earned.push('boundary_one');
  if (zeroAxes.length >= 2) earned.push('boundary_many');

  if (state.wildcardOpportunities >= 4 && (state.wildcardSelected / state.wildcardOpportunities) >= 0.5) {
    earned.push('wildcard_master');
  }

  var usedCategories = CATEGORIES.filter(function (c) { return state.categoryPlayCount[c.key] > 0; });
  if (usedCategories.length === 4 && usedCategories.every(function (c) { return state.categoryPlayCount[c.key] === 5; })) {
    earned.push('one_track');
  }

  ALL_LETTERS.forEach(function (letter) {
    var opp = state.plus2Opportunity[letter];
    var sel = state.plus2Selected[letter];
    if (opp >= 3 && (sel / opp) >= 0.75) {
      earned.push('certain_' + letter);
    }
  });

  return earned;
}

function pickRepresentativeSpecialTitle(earned) {
  if (earned.length === 0) return null;
  for (var i = 0; i < SPECIAL_TITLE_DISPLAY_ORDER.length; i++) {
    if (earned.indexOf(SPECIAL_TITLE_DISPLAY_ORDER[i]) !== -1) return SPECIAL_TITLE_DISPLAY_ORDER[i];
  }
  return earned[0];
}

function computeEnding(state) {
  var mbtiResult = computeFinalMbti(state);
  var changeCount = AXES.filter(function (ax) { return mbtiResult.axes[ax.key].changed; }).length;
  var baseTitle = computeBaseTitle(changeCount);
  var profiles = computeBehaviorProfiles(state);
  var specialTitles = computeSpecialTitles(state, mbtiResult);
  var representativeSpecialTitle = pickRepresentativeSpecialTitle(specialTitles);

  return {
    startMbti: state.startMbti,
    finalMbti: mbtiResult.finalMbti,
    axes: mbtiResult.axes,
    changeCount: changeCount,
    baseTitle: baseTitle,
    behaviorProfiles: profiles,
    specialTitles: specialTitles,
    representativeSpecialTitle: representativeSpecialTitle
  };
}

 * 3. 영구 저장 (26장 "중간 저장", 25장 "영구 저장 데이터")
 *    file:// 환경 등 localStorage 미동작 상황에서도 게임 자체는 진행 가능해야 하므로
 *    모든 접근을 try/catch로 감싼다.
 * ========================================================================= */

var STORAGE_KEY = 'mbtiChangeGame_current_v1';
var COLLECTION_KEY = 'mbtiChangeGame_collection_v1';

function saveState(state) {
  try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* 저장 불가 시 무시 */ }
}
function loadState() {
  try {
    var raw = window.localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function clearState() {
  try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) { /* 무시 */ }
}
function loadCollection() {
  try {
    var raw = window.localStorage.getItem(COLLECTION_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* 무시 */ }
  return { endings: {}, titles: {}, playCount: 0 };
}
function saveCollection(c) {
  try { window.localStorage.setItem(COLLECTION_KEY, JSON.stringify(c)); } catch (e) { /* 무시 */ }
}
function recordEndingToCollection(ending) {
  var c = loadCollection();
  var key = ending.startMbti + '>' + ending.finalMbti;
  c.endings[key] = true;
  c.titles[ending.baseTitle] = true;
  ending.specialTitles.forEach(function (id) { c.titles[SPECIAL_TITLE_NAMES[id]] = true; });
  c.playCount = (c.playCount || 0) + 1;
  saveCollection(c);
  return c;
}

/* =========================================================================
 * 4. 렌더링 (DOM)
 * ========================================================================= */

var gState = null;          // 현재 진행 중인 게임 상태
var gCurrentTurn = null;     // { event, displayedChoices: [{originalIndex, choice}] }
var gEndingPage = 1;
var gLastEnding = null;
var appEl = (typeof document !== 'undefined') ? document.getElementById('app') : null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function nl2br(s) { return escapeHtml(s).replace(/\n/g, '<br>'); }

function render() {
  if (!appEl) return;
  if (!gState) { appEl.innerHTML = renderStartHtml(); return; }
  if (gState.completed) { appEl.innerHTML = renderEndingHtml(); return; }
  if (gCurrentTurn) { appEl.innerHTML = renderEventHtml(); return; }
  appEl.innerHTML = renderTurnHtml();
}

function renderStartHtml() {
  var resumeSaved = loadState();
  var resumeBlock = '';
  if (resumeSaved && !resumeSaved.completed && resumeSaved.turn > 0) {
    resumeBlock = '<div class="card stack">' +
      '<p class="muted">이어할 수 있는 게임이 있습니다 (진행: ' + resumeSaved.turn + '/20턴, 시작 MBTI ' + resumeSaved.startMbti + ')</p>' +
      '<button class="btn primary" data-action="resume">이어하기</button>' +
      '</div>';
  }
  var axisRows = AXES.map(function (ax) {
    return '<div class="row" data-axis-group="' + ax.key + '">' +
      ax.letters.map(function (l) {
        return '<button class="btn toggle" style="flex:1" data-action="pick-letter" data-axis="' + ax.key + '" data-letter="' + l + '">' + l + '</button>';
      }).join('') +
      '</div>';
  }).join('');

  return '<div class="stack">' +
    '<h1>MBTI 변환게임</h1>' +
    '<p class="muted">20번의 선택을 거치며 처음 선택한 MBTI가 어디까지 움직이는지 확인하는 변환 게임입니다.</p>' +
    resumeBlock +
    '<div class="card stack">' +
    '<h2>현재 MBTI를 선택하세요</h2>' +
    axisRows +
    '<p class="muted small" id="start-selected"></p>' +
    '<button class="btn primary" data-action="start-game" id="start-game-btn" disabled>게임 시작</button>' +
    '</div>' +
    '</div>';
}

function renderTurnHtml() {
  var catButtons = CATEGORIES.map(function (c) {
    var locked = isCategoryLocked(gState, c.key);
    var count = gState.categoryPlayCount[c.key];
    return '<button class="btn cat-btn' + (locked ? ' locked' : '') + '" data-action="pick-category" data-cat="' + c.key + '" ' + (locked ? 'disabled' : '') + '>' +
      '<span>' + c.name + '</span><span class="count">' + count + '/5' + (locked ? ' · 완료' : '') + '</span>' +
      '</button>';
  }).join('');

  return '<div class="stack">' +
    '<div class="row" style="justify-content:space-between;align-items:center;">' +
    '<h1>턴 ' + (gState.turn + 1) + ' / 20</h1>' +
    '<span class="badge">시작 ' + gState.startMbti + '</span>' +
    '</div>' +
    '<div class="progress-bar"><div style="width:' + (gState.turn / 20 * 100) + '%"></div></div>' +
    '<div class="card stack">' +
    '<h2>이번 턴, 어떤 상황을 겪어볼까요?</h2>' +
    '<p class="muted small">잠기지 않은 카테고리는 몇 번이든 다시 선택할 수 있습니다.</p>' +
    '<div class="stack">' + catButtons + '</div>' +
    '</div>' +
    '</div>';
}

function renderEventHtml() {
  var ev = gCurrentTurn.event;
  var catName = CATEGORIES.filter(function (c) { return c.key === ev.categoryKey; })[0].name;
  var choicesHtml = gCurrentTurn.displayedChoices.map(function (entry, i) {
    return '<button class="btn" data-action="choose" data-idx="' + entry.originalIndex + '">' + nl2br(entry.choice.text) + '</button>';
  }).join('');

  return '<div class="stack">' +
    '<div class="row" style="justify-content:space-between;align-items:center;">' +
    '<span class="badge">' + catName + '</span>' +
    '<span class="muted small">턴 ' + (gState.turn + 1) + ' / 20</span>' +
    '</div>' +
    '<div class="card stack">' +
    '<h2>' + escapeHtml(ev.title) + '</h2>' +
    '<p class="prompt-text">' + nl2br(ev.prompt) + '</p>' +
    '</div>' +
    '<div class="stack">' + choicesHtml + '</div>' +
    '</div>';
}

function axisTrackHtml(axisKey, axInfo) {
  var ax = AXES.filter(function (a) { return a.key === axisKey; })[0];
  var a = ax.letters[0], b = ax.letters[1];
  var startIsA = axInfo.startLetter === a;
  var finalIsA = axInfo.finalLetter === a;
  return '<div class="stack" style="margin-bottom:10px;">' +
    '<p class="small muted">' + a + ' / ' + b + (axInfo.changed ? ' · 이동함' : axInfo.isZero ? ' · 팽팽함 (시작 글자 유지)' : ' · 그대로') + '</p>' +
    '<div class="axis-track">' +
    '<div class="axis-end' + (finalIsA ? ' hit' : '') + '">' + a + '</div>' +
    '<div class="axis-line"><span class="arrow">' + (axInfo.changed ? (startIsA ? a + ' → ' + b : b + ' → ' + a) : axInfo.finalLetter) + '</span></div>' +
    '<div class="axis-end' + (!finalIsA ? ' hit' : '') + '">' + b + '</div>' +
    '</div>' +
    '</div>';
}

function renderEndingHtml() {
  var ending = gLastEnding || (gLastEnding = computeEnding(gState));
  if (gEndingPage === 1) {
    return '<div class="stack">' +
      '<div class="card stack center">' +
      '<p class="muted">20번의 선택 끝에</p>' +
      '<p class="title-huge">' + ending.startMbti + '<span class="arrow-big">→</span>' + ending.finalMbti + '</p>' +
      '<p>' + ending.startMbti + '는 ' + ending.finalMbti + '가 되었습니다.</p>' +
      '<p class="badge">' + ending.changeCount + '글자 변화 · ' + ending.baseTitle + '</p>' +
      '</div>' +
      '<button class="btn primary" data-action="ending-next">변화 분석 보기</button>' +
      '</div>';
  }
  if (gEndingPage === 2) {
    var axesHtml = AXES.map(function (ax) { return axisTrackHtml(ax.key, ending.axes[ax.key]); }).join('');
    var profilesHtml;
    if (ending.behaviorProfiles.top.length === 0) {
      profilesHtml = '<p class="muted">뚜렷하게 반복된 행동 패턴은 없었습니다.</p>';
    } else {
      profilesHtml = ending.behaviorProfiles.top.map(function (p) {
        return '<div class="profile-card"><strong>' + p.name + '</strong><p class="small muted">' + p.desc + '</p></div>';
      }).join('');
    }
    return '<div class="stack">' +
      '<h2>네 축의 변화</h2>' +
      '<div class="card stack">' + axesHtml + '</div>' +
      '<h2>행동 분석</h2>' +
      '<div class="stack">' + profilesHtml + '</div>' +
      '<div class="footer-nav">' +
      '<button class="btn" data-action="ending-prev">이전</button>' +
      '<button class="btn primary" data-action="ending-next">수집 보상 보기</button>' +
      '</div>' +
      '</div>';
  }
  // page 3
  var collection = recordEndingToCollectionOnce(ending);
  var repName = ending.representativeSpecialTitle ? SPECIAL_TITLE_NAMES[ending.representativeSpecialTitle] : null;
  var specialHtml = repName
    ? '<div class="card center"><p class="muted small">이번 플레이의 대표 특수 칭호</p><p class="title-huge" style="font-size:1.3rem;">' + repName + '</p></div>'
    : '<p class="muted">이번 플레이에서는 특수 칭호를 얻지 못했습니다.</p>';
  var allSpecialHtml = ending.specialTitles.length
    ? '<p class="small muted">획득한 특수 칭호: ' + ending.specialTitles.map(function (id) { return SPECIAL_TITLE_NAMES[id]; }).join(', ') + '</p>'
    : '';
  var endingCount = Object.keys(collection.endings).length;
  var titleCount = Object.keys(collection.titles).length;

  return '<div class="stack">' +
    '<h2>수집 보상</h2>' +
    specialHtml +
    allSpecialHtml +
    '<div class="card stack">' +
    '<p>엔딩 도감: ' + endingCount + ' / 256</p>' +
    '<p>칭호 도감: ' + titleCount + ' / 17</p>' +
    '<p class="muted small">누적 플레이: ' + collection.playCount + '회</p>' +
    '</div>' +
    '<div class="footer-nav">' +
    '<button class="btn" data-action="ending-prev">이전</button>' +
    '<button class="btn primary" data-action="restart">다시 플레이</button>' +
    '</div>' +
    '</div>';
}

var gCollectionRecorded = false;
function recordEndingToCollectionOnce(ending) {
  if (!gCollectionRecorded) {
    gCollectionRecorded = true;
    return recordEndingToCollection(ending);
  }
  return loadCollection();
}

/* ---- 이벤트 처리 ---- */
var gSelectedLetters = {};

function onClick(e) {
  var target = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!target) return;
  var action = target.getAttribute('data-action');

  if (action === 'pick-letter') {
    var axis = target.getAttribute('data-axis');
    var letter = target.getAttribute('data-letter');
    gSelectedLetters[axis] = letter;
    if (!appEl) return;
    var group = appEl.querySelector('[data-axis-group="' + axis + '"]');
    if (group) {
      group.querySelectorAll('button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-letter') === letter);
      });
    }
    var allPicked = AXES.every(function (ax) { return gSelectedLetters[ax.key]; });
    var btn = document.getElementById('start-game-btn');
    if (btn) btn.disabled = !allPicked;
    var info = document.getElementById('start-selected');
    if (info) info.textContent = allPicked ? ('선택한 MBTI: ' + AXES.map(function (ax) { return gSelectedLetters[ax.key]; }).join('')) : '';
    return;
  }

  if (action === 'start-game') {
    var startMbti = AXES.map(function (ax) { return gSelectedLetters[ax.key]; }).join('');
    if (startMbti.length !== 4) return;
    gState = createInitialState(startMbti);
    gCurrentTurn = null;
    gEndingPage = 1;
    gLastEnding = null;
    gCollectionRecorded = false;
    saveState(gState);
    render();
    return;
  }

  if (action === 'resume') {
    var saved = loadState();
    if (saved) {
      gState = saved;
      gCurrentTurn = null;
      gEndingPage = 1;
      gLastEnding = null;
      gCollectionRecorded = false;
      render();
    }
    return;
  }

  if (action === 'pick-category') {
    var catKey = target.getAttribute('data-cat');
    if (isCategoryLocked(gState, catKey)) return;
    var event = pickRandomEvent(gState, catKey);
    if (!event) return;
    var order = shuffle(event.choices.map(function (c, i) { return i; }));
    gCurrentTurn = {
      event: event,
      displayedChoices: order.map(function (originalIndex) { return { originalIndex: originalIndex, choice: event.choices[originalIndex] }; })
    };
    render();
    return;
  }

  if (action === 'choose') {
    var idx = parseInt(target.getAttribute('data-idx'), 10);
    var displayedOrder = gCurrentTurn.displayedChoices.map(function (d) { return d.originalIndex; });
    recordChoice(gState, gCurrentTurn.event, idx, displayedOrder);
    gCurrentTurn = null;
    saveState(gState);
    if (gState.completed) clearState();
    render();
    return;
  }

  if (action === 'ending-next') { gEndingPage = Math.min(3, gEndingPage + 1); render(); return; }
  if (action === 'ending-prev') { gEndingPage = Math.max(1, gEndingPage - 1); render(); return; }

  if (action === 'restart') {
    gState = null;
    gCurrentTurn = null;
    gEndingPage = 1;
    gLastEnding = null;
    gCollectionRecorded = false;
    clearState();
    render();
    return;
  }
}

if (appEl) appEl.addEventListener('click', onClick);

function init() {
  gState = null;
  render();
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
}

/* =========================================================================
 * 5. 테스트 훅 — Node 환경의 단위 테스트에서 순수 로직에 접근하기 위한 용도.
 *    게임 플레이에는 영향을 주지 않는다.
 * ========================================================================= */
if (typeof window !== 'undefined') {
  window.__MBTI_TEST__ = {
    CATEGORIES: CATEGORIES,
    EVENTS: EVENTS,
    BEHAVIOR_PROFILES: BEHAVIOR_PROFILES,
    AXES: AXES,
    ALL_LETTERS: ALL_LETTERS,
    shuffle: shuffle,
    splitTags: splitTags,
    matchedProfileIds: matchedProfileIds,
    createInitialState: createInitialState,
    unplayedEventsForCategory: unplayedEventsForCategory,
    isCategoryLocked: isCategoryLocked,
    pickRandomEvent: pickRandomEvent,
    recordChoice: recordChoice,
    computeFinalMbti: computeFinalMbti,
    computeBaseTitle: computeBaseTitle,
    computeBehaviorProfiles: computeBehaviorProfiles,
    computeSpecialTitles: computeSpecialTitles,
    pickRepresentativeSpecialTitle: pickRepresentativeSpecialTitle,
    computeEnding: computeEnding
  };
}
</script>
